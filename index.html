function roadmapPath(){const p=me.player,ack=p?.acknowledged||0;const colors=['#ffd4e3','#ffe89d','#dfccff','#bcebd8','#bee3ff','#ffd6b6'],shadows=['#eaa1bc','#e7c363','#b798e4','#83c7af','#8abbe0','#e6af85'];return `<div class="roadmap-path" aria-label="خريطة الجولات الست">${names.map((n,i)=>{const r=p?.rounds?.[i],complete=r?.completed,available=!!p&&i===ack&&!complete&&!p.done,locked=!complete&&!available;return `<div class="map-stop"><button class="map-node ${complete?'done':available?'current':'locked'}" style="--node:${colors[i]};--shadow:${shadows[i]}" ${locked?'disabled':''} onclick="openRound(${i})" aria-label="${arabic[i]} — ${complete?'مكتملة':available?'ابدئي الجولة':'مقفلة'}" data-round="${i}"><span aria-hidden="true">${complete?'✓':locked?'🔒':icons[i]}</span><span class="node-badge">${i+1}</span></button><div class="map-label"><span class="status ${complete?'complete':''}">${complete?'✦ اكتملت':available?(p.count%5?'تابعي من حيث توقفتِ':'أنتِ هنا · جاهزة للانطلاق'):i===0&&!p?'ابدئي رحلتك':'تُفتح بعد الجولة السابقة'}</span><h3>${n}</h3><p>${arabic[i]}</p><p>${complete?`${r.score} / 50 نقطة · ${r.wrong} أخطاء`:'5 أسئلة · 50 نقطة'}</p>${complete?`<button class="ghost" style="background:transparent;color:#8562b4;font-size:10px;padding:0" onclick="openRound(${i})">عرض الإنجاز ←</button>`:''}</div></div>`}).join('')}</div>`}

const curriculumId="top-goal-1-t1-1448";
function syncCurriculum(){const m=me.player?.edition==="legacy"?legacyMetadata:curriculumMetadata;names=m.names;arabic=m.arabic;icons=m.icons;roundGuides=m.roundGuides}
function curriculumLabel(id){return id==="legacy"?"المسابقة السابقة · محتوى عام":"رابع ابتدائي · الفصل الأول · Top Goal 1"}
function roundintro(){const p=me.player;if(!p)return login();if(p.pendingRound!==null)return roundcomplete();if(p.done)return roadmap();const i=Math.floor(p.count/5),g=roundGuides[i];return `<section class="panel round-intro"><div class="intro-heading" style="--intro-color:${['#ffe1eb','#fff0bc','#e9deff','#d9f5e9','#d9eeff','#ffe5d4'][i]}"><span class="eyebrow">BEFORE YOU BEGIN · ROUND ${i+1} / 6</span><div class="intro-symbol" aria-hidden="true">${icons[i]}</div><h2 dir="ltr">${names[i]}</h2><p>${arabic[i]}</p></div><div class="journey-summary"><span>✏️ 5 أسئلة</span><span>⭐ 50 نقطة</span><span>✓ 10 نقاط لكل إجابة صحيحة</span></div><div class="intro-section"><h3>ماذا ستتعلّمين؟</h3><p>${g.goal}</p></div><div class="intro-section"><h3>كيف تلعبين؟</h3><p>${g.steps}</p></div><div class="intro-example"><span class="eyebrow">LET'S TRY AN EXAMPLE</span><h3>مثال توضيحي</h3><p class="example-question" dir="ltr" lang="en">${g.example}</p><p class="example-answer" dir="ltr" lang="en">${g.answer}</p><small>هذا مثال للتوضيح، ولا يُحسب ضمن أسئلة الجولة.</small></div><div class="notice">💡 ${g.tip}</div><p class="micro" style="text-align:center">بعد الأسئلة الخمسة ستظهر نقاطك وأخطاؤك. اضغطي «تم» بعدها لفتح الجولة التالية.</p><div class="actionrow"><button class="btn pink" id="start-round" onclick="go('quiz')">${p.count%5?'متابعة الجولة':'ابدئي الجولة'} ←</button><button class="btn light" onclick="go('roadmap')">العودة للخريطة</button></div></section>`}
function openRound(i){const p=me.player;if(!p){go('register');return}if(p.rounds[i]?.completed){selectedRound=i;go('roundcomplete');return}if(i!==p.acknowledged){toast('أكملي الجولة السابقة واضغطي تم لفتح هذه الجولة');return}go('roundintro')}
function roundcomplete(){const p=me.player;if(!p)return login();const i=selectedRound??p.pendingRound??Math.max(0,Math.floor(p.count/5)-1),r=p.rounds[i];if(!r?.completed)return roadmap();return `<section class="panel round-finish"><span class="eyebrow">ROUND COMPLETE · ${i+1} / 6</span><div><span class="celebrate-icon" aria-hidden="true">${i===5?'🏆':'🏅'}</span></div><h2>مبروك يا ${esc(p.alias)}! 🎉</h2><p class="round-title" dir="ltr">${names[i]}</p><p class="sub">${i===5?'أتممتِ آخر محطة في رحلة البطولة!':'أتممتِ الجولة '+(i+1)+'، وكل خطوة تزيدك مهارة!'}</p><div class="stats"><div class="stat"><b>${r.score}</b><small>من 50 نقطة</small></div><div class="stat"><b>${r.correct}</b><small>إجابات صحيحة</small></div><div class="stat"><b>${r.wrong}</b><small>أخطاء</small></div></div>${r.mistakes.length?`<div class="mistake-list"><h3 style="font-size:16px">نتعلّم من أخطائنا ✏️</h3>${r.mistakes.map(m=>`<article class="mistake-item"><h3 lang="en">${esc(m.question)}</h3><p class="answer-wrong">إجابتك: <b dir="ltr">${esc(m.selected)}</b></p><p class="answer-correct">الإجابة الصحيحة: <b dir="ltr">${esc(m.answer)}</b></p></article>`).join('')}</div>`:'<div class="notice" style="background:#eefbf3;color:#27835a;border-color:#cce9d6">خمس إجابات صحيحة! جولة كاملة بلا أخطاء ✦</div>'}<p class="micro">مجموع نقاط رحلتك حتى الآن: <b dir="ltr">${p.score} / 300</b></p><div class="actionrow"><button class="btn pink" id="round-done" onclick="finishRound(${i})">تم ✓</button></div><p class="micro">${i<5&&p.acknowledged===i?'اضغطي تم للعودة إلى الخريطة وفتح الجولة التالية.':'عودي إلى خريطة رحلتك لمشاهدة إنجازاتك.'}</p></section>`}
async function finishRound(i){if(busy)return;busy=true;const b=$('#round-done');if(b)b.disabled=true;try{const r=await api('round/ack',{round:i});me.player=r.player;selectedRound=null;await go('roadmap')}catch(e){toast(e.message);if(b)b.disabled=false}finally{busy=false}}
function authForm(newAccount){if(me.player)return result();return `<section class="panel narrow"><span class="eyebrow">WELCOME, CHAMPION</span><h2>${newAccount?'تسجيل جديد 🎟️':'تسجيل الدخول ✦'}</h2><p class="sub">${newAccount?'اكتبي اسمك واختاري رمزًا خاصًا بك، ثم ابدئي التحدي.':'اكتبي الاسم والرمز اللذين سجلتِ بهما لاستعادة تقدمك.'}</p><div class="actionrow"><button class="btn small ${newAccount?'':'light'}" onclick="go('register')">تسجيل جديد</button><button class="btn small ${newAccount?'light':''}" onclick="go('login')">تسجيل الدخول</button></div>${newAccount&&me.closed?'<div class="notice">التسجيل الجديد مغلق حاليًا. يمكنك الدخول لمشاركتك السابقة.</div>':`<form class="fields" id="${newAccount?'registration':'student-login'}"><label>اسم الطالبة<input name="name" autocomplete="username" required minlength="2" maxlength="70" placeholder="الاسم الذي ستستخدمينه في كل دخول"></label><label>الرمز الخاص بك<input name="code" type="password" dir="ltr" autocomplete="${newAccount?'new-password':'current-password'}" required ${newAccount?'minlength="6"':''} maxlength="80" placeholder="${newAccount?'اختاري رمزًا من 6 أحرف أو أرقام على الأقل':'الرمز الذي اخترتِه عند التسجيل'}"></label><label style="display:flex;align-items:center;gap:8px;font-weight:600"><input type="checkbox" style="width:17px;margin:0" onchange="this.form.elements.code.type=this.checked?'text':'password'">إظهار الرمز</label><div class="notice">${newAccount?'احتفظي باسمك ورمزك للدخول مرة أخرى. يظهر اسمك الأول في المتصدرات، واسمك الكامل على الشهادة.':'بدون بريد إلكتروني أو تأكيد حساب. تقدمك ونتيجتك محفوظان.'}</div><button class="btn pink" type="submit">${newAccount?'تسجيل جديد وبدء التحدي ←':'دخول وإكمال التحدي ←'}</button><p id="form-error" role="alert" class="hidden notice error"></p></form>`}<p class="micro">${newAccount?'سبق وسجلتِ؟ استخدمي تسجيل الدخول بالاسم والرمز نفسيهما.':'احتفظي برمزك في مكان آمن لتتمكني من العودة إلى مشاركتك.'}</p></section>`}
function login(){return authForm(false)}
function register(){return authForm(true)}
function quiz(){const p=me.player;if(!p)return register();if(p.pendingRound!==null&&!shownQuestion)return roundcomplete();if(p.done&&!shownQuestion)return roadmap();const q=shownQuestion||p.question;if(!q)return result();const i=Math.floor(q.index/5);return `<section class="quiz"><div class="quiz-top"><span><strong>${arabic[i]}</strong> · الجولة ${i+1} من 6</span><span>⭐ ${p.score} / 300</span></div><div class="progress" aria-label="التقدم ${p.count} من 30"><div style="width:${p.count/30*100}%"></div></div><div class="panel"><span class="roundtag">${icons[i]} ${names[i]}</span><p class="micro">السؤال ${q.index%5+1} من 5 في هذه الجولة · ${q.index+1} / 30</p><h2 class="prompt" lang="en">${esc(q.q)}</h2><p class="hint" lang="en">${esc(q.h)}</p>${q.unit?`<p class="micro" dir="ltr">${esc(q.unit)} · Book p. ${q.page}</p>`:""}<div class="choices">${q.o.map((o,j)=>`<button class="choice" onclick="answer(${j})" ${feedback?'disabled':''}><b>${'ABCD'[j]}</b><span>${esc(o)}</span></button>`).join('')}</div><div id="feedback" class="notice ${feedback?'':'hidden'}" role="status">${feedback?(feedback.right?'أحسنتِ! إجابة صحيحة +10 نقاط ✦':'الإجابة الصحيحة: <b dir="ltr">'+esc(feedback.answer)+'</b>'):''}</div><div class="actionrow"><button class="btn" id="next" onclick="nextQuestion()" ${feedback?'':'disabled'}>${q.index%5===4?'إنهاء الجولة 🏁':'السؤال التالي ←'}</button></div><p class="micro">تُحفظ إجابتك تلقائيًا. يمكنك العودة وإكمال التحدي لاحقًا.</p></div></section>`}
function result(){const p=me.player;if(!p)return register();if(!p.done)return `<section class="panel narrow"><h2>رحلتك مستمرة ✦</h2><p class="sub">أنجزتِ ${p.count} من 30 سؤالًا، وجمعتِ ${p.score} نقطة.</p><div class="progress"><div style="width:${p.count/30*100}%"></div></div><button class="btn" onclick="go('roadmap')">خريطة رحلتي ←</button></section>`;return `<section class="panel"><div class="result-title"><div style="font-size:65px">🏆</div><span class="eyebrow">YOU DID IT, CHAMPION!</span><h2 dir="ltr">Well done, ${esc(p.alias)}!</h2><p class="sub">ست جولات من التعلم… وإنجاز يستحق الفخر.</p></div><div class="stats"><div class="stat"><b>${p.score}</b><small>من 300 نقطة</small></div><div class="stat"><b>${Math.round(p.score/3)}%</b><small>دقة الإجابات</small></div><div class="stat"><b>#${p.rank}</b><small>مركزك الحالي</small></div></div><h3 style="font-size:15px">تألّقك في كل مهارة</h3>${names.map((n,i)=>`<div class="skill"><span dir="ltr">${icons[i]} ${n}</span><b>${p.skills[i]} / 50</b><div class="progress"><div style="width:${p.skills[i]*2}%"></div></div></div>`).join('')}<div class="actionrow"><button class="btn pink" onclick="go('certificate')">شهادة إنجازك ✧</button><button class="btn light" onclick="go('ranks')">لوحة المتصدرات ←</button></div><p class="micro" style="text-align:center">يتحدث المركز عند اكتمال مشاركات جديدة. عند تساوي النقاط، تتقدم صاحبة الوقت الأقل.</p></section>`}
function certificate(){const p=me.player;if(!p?.done)return result();return `<section class="panel"><div class="certificate" id="certificate" dir="ltr"><div class="seal">🏆</div><h2>English Champions</h2><h3>CERTIFICATE OF ACHIEVEMENT</h3><p>This certificate is proudly presented to</p><div class="name" dir="auto">${esc(p.name)}</div><p>For completing all six rounds of the<br><strong>English Champions Challenge</strong></p><p><strong>${p.score} / 300 POINTS</strong> &nbsp; · &nbsp; 30 QUESTIONS &nbsp; · &nbsp; 6 ROUNDS</p><p style="font-size:11px" dir="rtl">${curriculumLabel(p.edition)}</p><small>Issued ${new Date(p.completed).toLocaleDateString('en-GB')} · ID: ${p.id}</small><p style="font-size:11px;margin-top:20px">LEARN · PLAY · SHINE ✦</p></div><div class="actionrow noprint"><button class="btn" onclick="window.print()">حفظ PDF / طباعة ↓</button><button class="btn light" onclick="shareCertificate()">مشاركة التحقق ↗</button><button class="btn light" onclick="go('result')">النتيجة ←</button></div><p class="micro noprint">اختاري «حفظ كملف PDF» في نافذة الطباعة. رابط التحقق يعرض الاسم المستعار والدرجة فقط.</p></section>`}
function ranks(){return `<section class="panel"><span class="eyebrow" style="color:#a780d3">SMALL STEPS. BIG CHAMPIONS.</span><h2>لوحة المتصدرات 🏆</h2><p class="sub">${curriculumLabel(board.edition)} · ${board.total} مشاركة مكتملة</p><div class="notice">النقاط الأعلى أولًا، ثم الوقت الأقل عند التعادل؛ وتتشارك المتساويات بالنقاط والوقت المركز نفسه. تظهر الأسماء المستعارة حفاظًا على خصوصية الطالبات.</div>${me.player?.done?`<div class="stats"><div class="stat"><b>#${me.player.rank}</b><small>مركزك الحالي</small></div><div class="stat"><b>${me.player.score}</b><small>نقاطك</small></div><div class="stat"><b>${board.total}</b><small>أكملن التحدي</small></div></div>`:''}${board.list.length?rows(board.list):'<div class="empty">لم تكتمل مشاركات بعد. كوني أول بطلة!</div>'}${board.total>50?'<p class="micro">تظهر أول 50 مشاركة؛ مركزك أعلاه محسوب بين جميع المشاركات المكتملة.</p>':''}<div class="actionrow"><button class="btn light" onclick="go('ranks')">تحديث النتائج ↻</button></div></section>`}
function teacher(){if(!me.teacher)return `<section class="panel narrow"><h2>دخول المعلمة 🔐</h2><p class="sub">دخول خاص لإدارة المسابقة ومتابعة نتائج الطالبات.</p>${me.teacherConfigured?`<form class="fields" id="teacher-login"><label>رمز المعلمة<input name="password" type="password" required minlength="6" maxlength="256" autocomplete="current-password" dir="ltr"></label><button class="btn" type="submit">دخول لوحة المعلمة ←</button><p id="teacher-error" role="alert" class="hidden notice error"></p></form>`:'<div class="notice">دخول المعلمة يتطلب ربط Firebase وتفعيل حساب المعلمة. راجعي دليل الإعداد.</div>'}<p class="micro">تختار الطالبات أسماءهن ورموزهن بشكل مستقل.</p></section>`;const d=teacherData;if(!d)return '<div class="loading">جارٍ تحميل لوحة المعلمة…</div>';const activePlayers=d.players.filter(p=>p.question_set===curriculumId);const done=activePlayers.filter(p=>p.completed),avg=done.length?Math.round(done.reduce((s,p)=>s+p.score,0)/done.length):0;return `<section class="panel" style="max-width:1050px"><button class="btn small light" style="float:left" onclick="signOutTeacher()">خروج المعلمة</button><span class="eyebrow">TEACHER STUDIO</span><h2>كل إنجاز… يبدأ من هنا ✏️</h2><p class="sub">رابع ابتدائي · الفصل الأول · Top Goal 1. الإحصائيات للمنهج الجديد، والسجلات السابقة محفوظة بالجدول.</p><div class="stats"><div class="stat"><b>${activePlayers.length}</b><small>طالبة مسجلة بمنهج رابع</small></div><div class="stat"><b>${done.length}</b><small>أكملن المسابقة</small></div><div class="stat"><b>${avg}</b><small>متوسط النقاط من 300</small></div></div><div class="teachergrid"><div class="box"><h3>تسجيل الطالبات 🎟️</h3><p class="sub">تختار كل طالبة اسمها ورمزها الخاص بنفسها من «تسجيل جديد»، ثم تستخدمهما عند الدخول مرة أخرى.</p><div class="notice">لا تحتاج الطالبات إلى رمز من المعلمة أو بريد إلكتروني. الرمز خاص بالطالبة ولا يظهر في لوحة المعلمة.</div></div><div class="box"><h3>مهارات الطالبات 📊</h3>${curriculumMetadata.names.map((n,i)=>{const avg=done.length?Math.round(done.reduce((s,p)=>s+p.answers.slice(i*5,i*5+5).filter(a=>a.right).length,0)/done.length*20):0;return `<div class="skill"><span dir="ltr">${n}</span><b>${avg}%</b><div class="progress"><div style="width:${avg}%"></div></div></div>`}).join('')}</div></div><div class="actionrow"><button class="btn light" onclick="toggleRegistration()">${d.closed?'فتح التسجيل':'إغلاق التسجيل'}</button><button class="btn light" onclick="exportCSV()">تصدير نتائج CSV ↓</button><button class="btn light" onclick="go('teacher')">تحديث ↻</button></div><p class="micro">التسجيل ${d.closed?'مغلق':'مفتوح'}. إغلاق التسجيل لا يمنع الطالبات المسجلات من إكمال المسابقة.</p><h3 style="font-size:16px;margin-top:25px">مشاركات الطالبات</h3><div class="table-scroll"><table><thead><tr><th>الطالبة</th><th>الفصل</th><th>الاسم المستعار</th><th>التقدم</th><th>النقاط</th><th>الحالة</th><th>المحتوى</th></tr></thead><tbody>${d.players.map(p=>`<tr><td>${esc(p.name)}</td><td>${esc(p.class_name)}</td><td>${esc(p.alias)}</td><td>${p.answers.length}/30</td><td>${p.score}/300</td><td>${p.completed?'مكتملة':'قيد التقدم'}</td><td>${curriculumLabel(p.question_set)}</td></tr>`).join('')||'<tr><td colspan="7">لا توجد مشاركات مسجلة بعد.</td></tr>'}</tbody></table></div></section>`}
async function refresh(){try{me=await api('me')}catch(e){if(e.status===401)me={signedIn:false,player:null};else throw e}syncCurriculum();const a=$('#auth');a.textContent=me.signedIn?'تسجيل الخروج':'تسجيل الدخول';a.href=me.signedIn?'#logout':'#login';a.removeAttribute('target')}
let navigation=0;async function go(v){const ticket=++navigation;view=v;feedback=null;shownQuestion=null;history.replaceState(null,'','#'+v);document.querySelectorAll('[data-view]').forEach(b=>{b.classList.toggle('active',b.dataset.view===v);b.setAttribute('aria-current',b.dataset.view===v?'page':'false')});try{if(['ranks','result','roadmap','roundcomplete','roundintro','quiz','register','login','teacher','certificate'].includes(v))await refresh();if(v==='ranks'||v==='home')board=await api('leaderboard?edition='+(me.player?.edition||curriculumId));if(v==='teacher'&&me.teacher)teacherData=await api('teacher');if(ticket!==navigation)return;if(v==='quiz'&&me.player?.pendingRound!==null&&me.player?.pendingRound!==undefined){selectedRound=me.player.pendingRound;view='roundcomplete';history.replaceState(null,'','#roundcomplete')}render();window.scrollTo({top:0,behavior:'instant'})}catch(e){if(ticket===navigation){$('#main').innerHTML=`<section class="panel"><h2>تعذر تحميل الصفحة</h2><p class="notice error">${esc(e.message)}</p><button class="btn light" onclick="go('${v}')">حاولي مجددًا ↻</button></section>`}}}
function render(){const pages={home,roadmap,roundcomplete,roundintro,register,login,quiz,result,certificate,ranks,teacher};$('#main').innerHTML=(pages[view]||home)();$('#registration')?.addEventListener('submit',start);$('#student-login')?.addEventListener('submit',signIn);$('#invites')?.addEventListener('submit',createInvites);$('#teacher-login')?.addEventListener('submit',signInTeacher)}
async function start(e){e.preventDefault();if(busy)return;busy=true;const b=e.target.querySelector('button');b.disabled=true;try{const data=Object.fromEntries(new FormData(e.target));const r=await api('register',data);me.player=r.player;await go('roadmap')}catch(err){$('#form-error').textContent=err.message;$('#form-error').classList.remove('hidden')}finally{busy=false;b.disabled=false}}
async function signIn(e){e.preventDefault();if(busy)return;busy=true;const b=e.target.querySelector('button[type=submit]');b.disabled=true;try{const data=Object.fromEntries(new FormData(e.target));const r=await api('login',data);me.player=r.player;await go('roadmap')}catch(err){$('#form-error').textContent=err.message;$('#form-error').classList.remove('hidden')}finally{busy=false;b.disabled=false}}
async function startCurriculum(){if(busy)return;busy=true;try{await api('curriculum/start',{});await go('roadmap')}catch(e){toast(e.message)}finally{busy=false}}
async function signInTeacher(e){e.preventDefault();if(busy)return;busy=true;const button=e.target.querySelector('button'),notice=$('#teacher-error');button.disabled=true;try{const data=Object.fromEntries(new FormData(e.target));await api('admin/login',data);e.target.reset();await go('teacher')}catch(e){notice.textContent=e.message;notice.classList.remove('hidden')}finally{busy=false;button.disabled=false}}
async function signOutTeacher(){if(busy)return;busy=true;try{await api('admin/logout',{});teacherData=null;await go('teacher')}catch(e){toast(e.message)}finally{busy=false}}
async function signOut(){if(busy)return;busy=true;try{await api('logout',{});me.player=null;await refresh();await go('login')}catch(e){toast(e.message)}finally{busy=false}}
async function answer(choice){if(busy||feedback)return;busy=true;const q=me.player.question;shownQuestion=q;document.querySelectorAll('.choice').forEach(b=>b.disabled=true);try{const r=await api('answer',{index:q.index,choice});me.player=r.player;feedback=r.feedback;render();const buttons=document.querySelectorAll('.choice');buttons[choice]?.classList.add(feedback.right?'selected':'wrong');buttons.forEach((b,i)=>{if(q.o[i]===feedback.answer)b.classList.add('selected')})}catch(e){shownQuestion=null;toast(e.message);await refresh();render()}finally{busy=false}}
function nextQuestion(){if(!feedback||busy)return;const k=shownQuestion.index;feedback=null;shownQuestion=null;if(k%5===4){selectedRound=Math.floor(k/5);go('roundcomplete');return}render();window.scrollTo({top:0,behavior:'instant'})}
async function toggleRegistration(){if(busy)return;busy=true;try{await api('teacher/settings',{closed:!teacherData.closed});await go('teacher')}catch(e){toast(e.message)}finally{busy=false}}
function download(content,type,name){const url=URL.createObjectURL(new Blob([content],{type}));const a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function csvCell(v){let s=String(v??'');if(/^[\s]*[=+@-]/.test(s)||/^[\t\r\n]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"'}
function exportCSV(){const rows=[['Name','Alias','Class','Score','Progress','Completed','DurationSec','Curriculum'],...teacherData.players.map(p=>[p.name,p.alias,p.class_name,p.score,p.answers.length,!!p.completed,p.duration,curriculumLabel(p.question_set)])];download('\ufeff'+rows.map(r=>r.map(csvCell).join(',')).join('\r\n'),'text/csv;charset=utf-8','english-champions-results.csv')}
let freshCodes=[];async function createInvites(e){e.preventDefault();if(busy)return;busy=true;const b=e.target.querySelector('button');b.disabled=true;try{const data=Object.fromEntries(new FormData(e.target));const d=await api('teacher/invites',{label:data.label,count:Number(data.count)});freshCodes=d.codes;$('#codes').innerHTML='<div class="notice">احفظي الرموز الآن؛ لا تُعرض كاملة مرة أخرى.</div><textarea readonly aria-label="رموز المشاركة"></textarea><button class="btn small light" onclick="downloadCodes()">تنزيل الرموز ↓</button>';$('#codes textarea').value=freshCodes.join('\n');}catch(e){toast(e.message)}finally{busy=false;b.disabled=false}}
function downloadCodes(){download(freshCodes.join('\n'),'text/plain;charset=utf-8','english-champions-invites.txt')}
async function shareCertificate(){const url=location.href.split('#')[0]+'#verify/'+me.player.id;try{if(navigator.share)await navigator.share({title:'English Champions — Certificate',url});else{await navigator.clipboard.writeText(url);toast('نُسخ رابط التحقق من الشهادة')}}catch(e){if(e.name!=='AbortError')toast('رابط التحقق: '+url)}}
async function verify(id){try{const p=await api('verify/'+encodeURIComponent(id));$('#main').innerHTML=`<section class="panel narrow" style="text-align:center"><div style="font-size:65px">🏅</div><h2>شهادة موثّقة</h2><p class="prompt">${esc(p.alias)}</p><p>أكملت الجولات الست في English Champions</p><p class="sub">${curriculumLabel(p.question_set)}</p><strong>${p.score} / 300 نقطة</strong><p class="micro">${new Date(p.completed).toLocaleDateString('ar')}</p><button class="btn light" onclick="go('home')">الرئيسية</button></section>`}catch(e){$('#main').innerHTML=`<div class="panel narrow"><h2>تعذر التحقق من الشهادة</h2><p>${esc(e.message)}</p><button class="btn light" onclick="go('home')">الرئيسية</button></div>`}}
document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>go(b.dataset.view)));window.addEventListener('hashchange',()=>route());function route(){const v=location.hash.slice(1)||'home';if(v==='logout'){signOut();return}if(v.startsWith('verify/'))verify(v.slice(7));else go(['home','roadmap','roundcomplete','roundintro','register','login','quiz','result','ranks','teacher','certificate'].includes(v)?v:'home')}

let openingTimer,openingReturnFocus;
function dismissOpening(){const screen=document.getElementById('opening-screen');if(!screen)return;clearTimeout(openingTimer);screen.classList.add('leaving');screen.inert=true;document.body.style.overflow='';const app=document.querySelector('body>.wrap');app.inert=false;app.removeAttribute('aria-hidden');setTimeout(()=>{screen.remove();const target=document.querySelector('#main h1,#main h2');if(target){target.tabIndex=-1;target.focus({preventScroll:true})}},450)}
function showOpening(){if(location.hash&&location.hash!=='#home')return;const screen=document.createElement('div');screen.id='opening-screen';screen.className='opening-screen';screen.setAttribute('role','dialog');screen.setAttribute('aria-modal','true');screen.setAttribute('aria-label','مرحبًا بك في بطلات الإنجليزية');screen.innerHTML=`<button class="opening-skip" onclick="dismissOpening()">تخطّي المقدمة ←</button><section class="hero" aria-label="مرحبًا بكِ في English Champions"><svg class="hero-decor hero-track" viewBox="0 0 250 160" aria-hidden="true"><path d="M-10 110 Q40 160 80 70 T240 50" fill="none" stroke="#b29bd4" stroke-width="3" stroke-dasharray="7 10"/></svg><span class="hero-decor hero-star" aria-hidden="true">★</span><span class="hero-decor hero-star second" aria-hidden="true">★</span><span class="hero-decor hero-star third" aria-hidden="true">★</span><span class="hero-decor hero-spark" aria-hidden="true">✦</span><div class="hero-decor hero-abc" aria-hidden="true"><b>A</b><b>B</b><b>C</b></div><div class="hero-decor hero-notebook" aria-hidden="true"><i class="hero-pencil"></i></div><div class="hero-copy"><span class="eyebrow">✦ YOUR NEXT CHAPTER STARTS HERE</span><div class="opening-label">مبادرة</div><h1>English<br><span>Champions</span></h1><p>تعلّمي، نافسي، وتألقّي! رحلة مليئة بالتحديات اللغوية، وكل إجابة تقرّبك من لقب بطلة الإنجليزية.</p><button class="btn pink" onclick="dismissOpening()">دخول المنصة <span>←</span></button><div class="tiny-note">المعلمة نوره كويم</div></div><div class="hero-art">${art}</div></section>`;document.body.append(screen);document.body.style.overflow='hidden';const app=document.querySelector('body>.wrap');app.inert=true;app.setAttribute('aria-hidden','true');screen.querySelector('button').focus({preventScroll:true});screen.addEventListener('keydown',e=>{if(e.key==='Escape')dismissOpening();if(e.key==='Tab'){const buttons=[...screen.querySelectorAll('button')];if(e.shiftKey&&document.activeElement===buttons[0]){e.preventDefault();buttons.at(-1).focus()}else if(!e.shiftKey&&document.activeElement===buttons.at(-1)){e.preventDefault();buttons[0].focus()}}});openingTimer=setTimeout(dismissOpening,8000)}
showOpening();

(async()=>{try{await refresh()}catch(e){toast(e.message)}route()})();
</script></body></html>
