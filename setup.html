<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تفعيل أسئلة English Champions</title><style>body{font:16px/2 system-ui;background:#f7f2ff;color:#332052;margin:0;padding:24px}main{max-width:600px;margin:30px auto;background:white;border-radius:24px;padding:28px}input,button{font:inherit;box-sizing:border-box;width:100%;padding:12px;margin:8px 0;border:1px solid #d9cbed;border-radius:10px}button{background:#7042df;color:white;cursor:pointer}pre{white-space:pre-wrap}a{color:#7042df}</style><main><h1>تفعيل أسئلة المسابقة</h1><p>هذه الخطوة للمعلمة مرة واحدة بعد ربط Firebase ونشر القواعد. ملف الإجابات يُرسل إلى قاعدة البيانات المحمية، ولا يُرفع إلى GitHub.</p><form id="form"><label>بريد حساب المعلمة<input name="email" type="email" required autocomplete="username" dir="ltr"></label><label>كلمة المرور<input name="password" type="password" required autocomplete="current-password" dir="ltr"></label><label>ملف answer-keys.json من مجلد private<input id="file" type="file" accept=".json,application/json" required></label><button>دخول وتفعيل الأسئلة</button></form><pre id="status" role="status"></pre><a href="./index.html#teacher">العودة للمنصة ←</a></main><script type="module">
import {api,importKeys} from './firebase-api.js';
const form=document.querySelector('form'),status=document.querySelector('#status');form.onsubmit=async e=>{e.preventDefault();const b=form.querySelector('button');b.disabled=true;status.textContent='جارٍ التفعيل…';try{const d=Object.fromEntries(new FormData(form));await api('admin/login',d);const keys=JSON.parse(await document.querySelector('#file').files[0].text());await importKeys(keys);form.reset();status.textContent='تم تفعيل الأسئلة الثلاثين. يمكنك الآن فتح المنصة.';}catch(e){status.textContent=e.message;}finally{b.disabled=false;}};
</script></html>
